apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flash-sale-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-username/flash-sale-ecommerce.git' # Replace with actual Git repo URL
    targetRevision: HEAD
    path: infrastructure/kubernetes/base
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: flash-sale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
