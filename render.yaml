services:
  # ==========================================
  # 1. Combined Backend Service (API + Worker)
  # ==========================================
  - type: web
    name: flash-sale-backend
    env: docker
    dockerContext: .
    dockerfilePath: docker/Dockerfile.free
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      
      # The following secrets will need to be provided in the Render Dashboard securely
      - key: FRONTEND_URL
        sync: false # Set this to your Netlify URL
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
